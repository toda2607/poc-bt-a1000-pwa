<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT-A1000 PWA Compatibility Test</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 22px;
    }

    .info {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
    }

    .result {
      background: white;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
    }

    .ok {
      border-left: 6px solid green;
    }

    .ng {
      border-left: 6px solid red;
    }

    .warn {
      border-left: 6px solid orange;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h1>BT-A1000 PWA Compatibility Test</h1>

<div class="info">
  <strong>Browser Information</strong>
  <pre id="browserInfo"></pre>
</div>

<div id="results"></div>

<script>

const results = document.getElementById("results");

function addResult(name, status, detail = "") {

  const div = document.createElement("div");

  div.className =
    "result " +
    (status === "OK"
      ? "ok"
      : status === "NG"
      ? "ng"
      : "warn");

  div.innerHTML =
    "<strong>" + name + "</strong><br>" +
    status +
    (detail ? "<br>" + detail : "");

  results.appendChild(div);
}

//
// Browser information
//

document.getElementById("browserInfo").textContent =
  "UserAgent:\n" +
  navigator.userAgent +
  "\n\nURL:\n" +
  location.href;

//
// Secure Context
//

addResult(
  "Secure Context",
  window.isSecureContext ? "OK" : "NG",
  "isSecureContext = " + window.isSecureContext
);

//
// Service Worker API
//

if ("serviceWorker" in navigator) {

  addResult(
    "Service Worker API",
    "OK",
    "navigator.serviceWorker exists"
  );

} else {

  addResult(
    "Service Worker API",
    "NG",
    "navigator.serviceWorker does not exist"
  );
}

//
// Cache API
//

async function testCache() {

  if (!("caches" in window)) {

    addResult(
      "Cache API",
      "NG",
      "window.caches does not exist"
    );

    return;
  }

  try {

    const cache = await caches.open("bt-a1000-test");

    const response =
      new Response("BT-A1000 cache test");

    await cache.put(
      "/bt-a1000-cache-test",
      response
    );

    const cached =
      await cache.match("/bt-a1000-cache-test");

    const text =
      cached ? await cached.text() : null;

    if (text === "BT-A1000 cache test") {

      addResult(
        "Cache API",
        "OK",
        "write/read successful"
      );

    } else {

      addResult(
        "Cache API",
        "NG",
        "cache read failed"
      );
    }

  } catch (e) {

    addResult(
      "Cache API",
      "NG",
      String(e)
    );
  }
}

//
// IndexedDB
//

function testIndexedDB() {

  if (!("indexedDB" in window)) {

    addResult(
      "IndexedDB",
      "NG",
      "indexedDB does not exist"
    );

    return;
  }

  try {

    const request =
      indexedDB.open("bt-a1000-test-db", 1);

    request.onupgradeneeded = function(event) {

      const db = event.target.result;

      if (!db.objectStoreNames.contains("test")) {

        db.createObjectStore(
          "test",
          { keyPath: "id" }
        );
      }
    };

    request.onsuccess = function(event) {

      const db = event.target.result;

      const tx =
        db.transaction("test", "readwrite");

      const store =
        tx.objectStore("test");

      store.put({
        id: 1,
        value: "BT-A1000 IndexedDB Test"
      });

      tx.oncomplete = function() {

        const readTx =
          db.transaction("test", "readonly");

        const readStore =
          readTx.objectStore("test");

        const getRequest =
          readStore.get(1);

        getRequest.onsuccess = function() {

          if (
            getRequest.result &&
            getRequest.result.value ===
            "BT-A1000 IndexedDB Test"
          ) {

            addResult(
              "IndexedDB",
              "OK",
              "write/read successful"
            );

          } else {

            addResult(
              "IndexedDB",
              "NG",
              "read failed"
            );
          }
        };
      };
    };

    request.onerror = function() {

      addResult(
        "IndexedDB",
        "NG",
        request.error
          ? String(request.error)
          : "open failed"
      );
    };

  } catch (e) {

    addResult(
      "IndexedDB",
      "NG",
      String(e)
    );
  }
}

//
// LocalStorage
//

try {

  localStorage.setItem(
    "bt-a1000-test",
    "success"
  );

  const value =
    localStorage.getItem(
      "bt-a1000-test"
    );

  addResult(
    "LocalStorage",
    value === "success"
      ? "OK"
      : "NG",
    "write/read test"
  );

} catch (e) {

  addResult(
    "LocalStorage",
    "NG",
    String(e)
  );
}

//
// Fetch API
//

addResult(
  "Fetch API",
  "fetch" in window
    ? "OK"
    : "NG"
);

//
// Promise
//

addResult(
  "Promise",
  "Promise" in window
    ? "OK"
    : "NG"
);

//
// WebSocket
//

addResult(
  "WebSocket",
  "WebSocket" in window
    ? "OK"
    : "NG"
);

//
// Service Worker Registration
//

async function registerServiceWorker() {

  if (!("serviceWorker" in navigator))
    return;

  try {

    const registration =
      await navigator.serviceWorker.register(
        "./sw.js"
      );

    await navigator.serviceWorker.ready;

    addResult(
      "Service Worker Registration",
      "OK",
      "registered and ready"
    );

  } catch (e) {

    addResult(
      "Service Worker Registration",
      "NG",
      String(e)
    );
  }
}

//
// Execute
//

testCache();
testIndexedDB();
registerServiceWorker();

</script>

</body>
</html>
